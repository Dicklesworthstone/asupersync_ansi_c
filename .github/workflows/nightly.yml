# =============================================================================
# nightly.yml — Nightly extended fuzzing + e2e + schema validation (bd-15k)
#
# Runs on a daily schedule and manual dispatch. Exercises longer-running test suites that are impractical for PR-level CI.
#
# Jobs:
#   fuzz-nightly             Extended C differential fuzzing (100K iterations)
#   fuzz-rust-differential   Rust-vs-C differential fuzzing over DSL v2, 5 x 4000 scenarios (bd-ij9w)
#   fuzz-metamorphic         M1-M4 over generated scenarios, 5 x 50000 cases (bd-9kll.12.1)
#   fuzz-parsers-soak        The 12 libFuzzer parser harnesses, 20 min each from the committed corpus (bd-9kll.16.3)
#   e2e-extended             Full e2e suite including vertical lanes
#   schema-check             Strict schema validation of all fixtures
# =============================================================================

name: Nightly

on:
  schedule:
    # Run at 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 1
  ASX_CI_RUN_TAG: "nightly-${{ github.run_id }}-${{ github.run_attempt }}"
  ASX_CI_ARTIFACT_ROOT: build/ci-manifests

jobs:
  # ---------------------------------------------------------------------------
  # fuzz-rust-differential — Rust vs C over DSL v2 (bd-ij9w), 20000
  # scenarios a night (bd-9kll.4.2: the schedule-certificate criterion is
  # "equal to Rust's on >= 20k random scenarios"). twin_run generates seeded
  # scenarios and runs them in asupersync's LabRuntime at the pinned rev; the
  # C runtime runs every one Rust captured (lab dispatch, same seed) and must
  # match trace, snapshot, observations, dispatch order and schedule
  # certificate, and replay Rust's own schedule. Any divergence fails its
  # shard (fail-fast is off: the other shards still report). The 20000 are 5
  # shards of 4000, one runner each, seed day*5+shard, so no seed repeats
  # across shards or days. One shard of 4000 (seed 103695, 3998 captured and
  # compared, 0 divergent) took 633 s on worker B, one core on a host at
  # load 8 to 10, after a cold twin_run build of 8 min that the cache below
  # removes from the second night; the timeout stops a hang or a slow runner
  # instead of the 6 h limit. The seed is printed and a failure replays with
  # `make fuzz-differential FUZZ_V2_SEED=<seed> FUZZ_V2_COUNT=4000`; twin_run
  # minimize reduces each divergence (build/fuzz_v2/seed-<seed>/minimized)
  # and those, with the shard's compare and capture logs, are uploaded.
  # A push runs seed 9 x 200 (ci.yml) as the regression gate.
  # ---------------------------------------------------------------------------
  fuzz-rust-differential:
    name: "fuzz: Rust vs C differential (DSL v2, shard ${{ matrix.shard }}, 4000 scenarios each)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          pipx install check-jsonschema==0.38.2

      - name: Rust toolchain (rust-toolchain.toml pin)
        run: rustup toolchain install

      - name: Cache twin_run build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/twin_run/target
          key: twin-run-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'tools/twin_run/Cargo.lock') }}

      - name: twin_run release build
        run: make twin-run-build

      - name: Differential fuzzing (seed per day and shard, 4000 scenarios each)
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          seed=$(( day * 5 + ${{ matrix.shard }} ))
          echo "== seed $seed"
          if ! make fuzz-differential FUZZ_V2_SEED=$seed FUZZ_V2_COUNT=4000 \
              ASX_TWIN_BIN=tools/twin_run/target/release/twin_run; then
            # Reduce each divergence for the artifact; the shard fails either way.
            make fuzz-minimize FUZZ_V2_SEED=$seed \
              ASX_TWIN_BIN=tools/twin_run/target/release/twin_run || true
            exit 1
          fi

      - name: Upload divergences and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-rust-differential-${{ matrix.shard }}-${{ env.ASX_CI_RUN_TAG }}
          path: |
            build/fuzz_v2/seed-*/minimized/
            build/fuzz_v2/seed-*/compare.log
            build/fuzz_v2/seed-*/capture.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # fuzz-metamorphic — the metamorphic relations M1 to M4 over scenarios
  # generated now (bd-9kll.12.1), 250000 cases per relation a night. A push
  # runs 10000 of seed 12100 (ci.yml); this explores new seeds. The 250000
  # are 5 shards of 50000, one runner each, because one run is about 2.8 h at
  # the worker's rate (401 s per 10000 cases, one core) and a runner's rate
  # is not measured: a shard is about 33 min at the worker's rate, and its
  # timeout stops a hang or a slow runner instead of the 6 h limit.
  # The seed is printed and replays with
  # `make fuzz-metamorphic MM_FUZZ_SEED=<seed> MM_FUZZ_CASES=50000`.
  # Exit 1 is a violation (the ddmin-reduced scenario is uploaded, a
  # candidate fixture); exit 2 is a stream that ended short of the cases
  # (the generator did not run or produced too little): both fail the shard.
  # ---------------------------------------------------------------------------
  fuzz-metamorphic:
    name: "fuzz: metamorphic relations (shard ${{ matrix.shard }}, 50000 cases each)"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml pin)
        run: rustup toolchain install

      - name: Cache twin_run build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/twin_run/target
          key: twin-run-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'tools/twin_run/Cargo.lock') }}

      - name: twin_run release build
        run: make twin-run-build

      - name: Metamorphic relations M1-M4 (seed per day and shard, 50000 cases each)
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          seed=$(( day * 5 + ${{ matrix.shard }} ))
          echo "== seed $seed"
          make fuzz-metamorphic MM_FUZZ_SEED=$seed MM_FUZZ_CASES=50000 \
            ASX_TWIN_BIN=tools/twin_run/target/release/twin_run

      - name: Upload minimized scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-metamorphic-${{ matrix.shard }}-${{ env.ASX_CI_RUN_TAG }}
          path: build/metamorphic/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # fuzz-parsers-soak — each parser harness of tests/fuzz/fuzz_parsers.c under
  # libFuzzer + ASan + UBSan for 20 minutes, one runner each, from the
  # committed corpus (tests/fuzz/parsers_seeds, bd-9kll.16.3). A push runs
  # 60 s of each (ci.yml, fuzz-parsers-smoke); this is the longer exploration,
  # and not a 24 h soak. A crash, a sanitizer report or a timeout fails the
  # shard (tools/ci/run_fuzz_soak.sh restarts the harness after it so the
  # time is spent, and keeps every finding): the crashing inputs are
  # uploaded as `crashes`, with the log and the grown corpus (what
  # `-merge=1` folds into the committed seeds; a new crash is minimized,
  # committed as a regression seed and fixed).
  # ---------------------------------------------------------------------------
  fuzz-parsers-soak:
    name: "fuzz: parser soak (${{ matrix.target }}, 20 min)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - HTTP_REQUEST
          - HTTP_RESPONSE
          - WEBSOCKET
          - BASE64
          - CODEC_JSON
          - CODEC_BIN
          - WEB_QUERY
          - RAPTORQ_OTI
          - RAPTORQ_DECODE
          - FRAME_CODECS
          - RESOLVE_HOST
          - JSON_READER
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          # libFuzzer's runtime: the generic package where the release has
          # one, else the one matching the installed clang.
          sudo apt-get install -y -qq libclang-rt-dev ||
            sudo apt-get install -y -qq "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Soak ${{ matrix.target }} for 20 minutes
        run: |
          make fuzz-parsers-soak FUZZ_PARSER_TARGETS=${{ matrix.target }} \
            FUZZ_PARSERS_SOAK_SECONDS=1200

      - name: Upload findings, log and grown corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-parsers-soak-${{ matrix.target }}-${{ env.ASX_CI_RUN_TAG }}
          path: |
            build/fuzz-parsers/soak/summary.md
            build/fuzz-parsers/soak/${{ matrix.target }}/crashes/
            build/fuzz-parsers/soak/${{ matrix.target }}/corpus/
            build/fuzz-parsers/soak/${{ matrix.target }}/log.txt
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # fuzz-nightly — extended differential fuzzing (100K iterations)
  # ---------------------------------------------------------------------------
  fuzz-nightly:
    name: "fuzz: nightly differential (100K)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Build library
        run: make build

      - name: Build fuzz harness
        run: make fuzz-build

      - name: Run nightly fuzzing
        id: fuzz_nightly
        run: make fuzz-nightly

      - name: Run minimizer self-test
        id: minimize
        if: always() && steps.fuzz_nightly.outcome == 'success'
        run: |
          if make minimize-selftest 2>/dev/null; then
            echo "minimizer selftest passed"
          else
            echo "minimizer selftest skipped or not available"
          fi

      - name: Emit nightly fuzz manifest
        if: always()
        run: |
          mkdir -p "${ASX_CI_ARTIFACT_ROOT}"
          lane="fuzz-nightly"
          status="pass"
          first_failure=""

          if [ "${{ steps.fuzz_nightly.outcome }}" = "failure" ]; then
            status="fail"
            first_failure="fuzz-nightly"
          fi

          jq -n \
            --arg lane "$lane" \
            --arg status "$status" \
            --arg run_tag "${{ env.ASX_CI_RUN_TAG }}" \
            --arg sha "${{ github.sha }}" \
            --arg first_failure "$first_failure" \
            '{
              lane: $lane,
              status: $status,
              run_tag: $run_tag,
              sha: $sha,
              first_failure: (if $first_failure == "" then null else $first_failure end)
            }' > "${ASX_CI_ARTIFACT_ROOT}/${lane}.manifest.json"

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-${{ env.ASX_CI_RUN_TAG }}
          path: |
            build/fuzz/
            ${{ env.ASX_CI_ARTIFACT_ROOT }}/fuzz-nightly.manifest.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # e2e-extended — full e2e suite with vertical lanes
  # ---------------------------------------------------------------------------
  e2e-extended:
    name: "e2e: full suite + vertical lanes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq python3

      - name: Build library
        run: make build

      - name: Run e2e suite
        id: e2e_suite
        run: make test-e2e

      - name: Run vertical e2e lanes
        id: e2e_vertical
        run: make test-e2e-vertical

      - name: Run conformance + codec equivalence + profile parity
        id: conformance
        run: |
          make conformance
          make codec-equivalence
          make profile-parity

      - name: Run schema validation (strict)
        id: schema_check
        run: ./tools/ci/validate_schemas.sh --strict

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-extended-${{ env.ASX_CI_RUN_TAG }}
          path: |
            build/conformance/
            build/e2e/
          retention-days: 14
