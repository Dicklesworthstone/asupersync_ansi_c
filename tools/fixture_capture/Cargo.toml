[package]
name = "fixture-capture"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "fixture_capture"
path = "src/main.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "5e60b1c4c53d62aaddae68de3ee7de4732f1755b", features = ["test-internals"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
