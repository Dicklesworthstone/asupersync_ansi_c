[package]
name = "rust-fuzz-target"
version = "0.1.0"
edition = "2024"
publish = false
description = "Retired incompatible-digest experiment; use tools/twin_run for live Rust/C parity"

[[bin]]
name = "rust_fuzz_target"
path = "src/main.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "5e60b1c4c53d62aaddae68de3ee7de4732f1755b", features = ["test-internals"] }
serde_json = "1"
